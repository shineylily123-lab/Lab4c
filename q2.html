<!DOCTYPE html>
<html>
<head>
    <title>Question 2 - JSON</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <h2>Book Information</h2>

    <p id="bookTitle"></p>
    <p id="bookAuthor"></p>
    <p id="bookGenres"></p>

    <script>

        $.getJSON("books.json", function(data) {

            let title = data.books[0].title;
            console.log("First Book Title: " + title);
            $("#bookTitle").text("First Book Title: " + title);

            let author = data.books[1].author;
            console.log("Second Book Author: " + author);
            $("#bookAuthor").text("Second Book Author: " + author);

            let genres = "";

            $.each(data.books, function(index, book) {
                genres += book.title + ": " + book.genres.join(", ") + " | ";
            });

            console.log("Genres of All Books: " + genres);
            $("#bookGenres").text("Genres: " + genres);

        });
        .fail(function() {
    console.log("Error: Cannot load books.json");
});

    </script>

</body>
</html>
